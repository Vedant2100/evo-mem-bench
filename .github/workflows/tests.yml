name: Offline tests and pinned upstream patch
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Bootstrap and compile upstream integration
        run: |
          bash scripts/bootstrap_upstream.sh
          python -m compileall -q vendor/EvoMemBench/Cross-Episode-Execution/Embodied-AI/CROSSEP-EMB/scripts/eval_alfworld_with_memory.py
          python scripts/prepare_manifest.py --validate-only
          python scripts/run_experiment.py --plan smoke --dry-run
